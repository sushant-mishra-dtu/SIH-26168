name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # The stamping code reads the commit SHA; a shallow clone still gives HEAD, but the
          # full history keeps `git describe` usable if we add tags later.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # torch is deliberately NOT installed. The harness is the critical path and must never be
      # blocked on a 2 GB download -- see pyproject [project.optional-dependencies].
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Protocol dry run
        run: python -m eval.run --dry-run

  leakage-audit:
    # Split into its own job so it reads as a distinct, visible gate in the PR checks rather than
    # one line inside a longer test log. PS 26168 disallows wheel odometry; if this is ever green
    # when it should be red, every number in the submission is invalid.
    name: leakage audit (wheel-speed ban)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wheel-speed leakage tests
        run: pytest tests/test_leakage.py -v

      - name: Verify the guard actually rejects a V- column
        # A guard never observed to fire is not known to work. This asserts the failure path
        # directly, so the audit cannot pass because the check silently became a no-op.
        run: |
          python - <<'PY'
          from eval.loaders.columns import LeakageError, assert_no_leakage
          for bad in ["Wheel Speed FL (rad/s)", "V-wheel_speed_rr", "Steering Angle (deg)"]:
              try:
                  assert_no_leakage(["accel_x", bad])
              except LeakageError:
                  print(f"OK  rejected {bad!r}")
              else:
                  raise SystemExit(f"LEAKAGE GUARD IS BROKEN: {bad!r} was accepted")
          print("leakage guard verified")
          PY
