# --- what deliberately is NOT here ---------------------------------------------------------
# `org.gradle.java.home` is machine-specific and must never be committed (HANDOVER.md section 2,
# constraint 6). It was committed once in the nested Gradle root that d3d6df3 removed, and again
# here in the root that survived it; both are now gone.
#
# Set the Gradle JDK per machine instead, in either of the two places Gradle reads and git does
# not: Android Studio's *Gradle JDK* setting, or your own `~/.gradle/gradle.properties`.
#
# If Gradle will not start at all -- "Unable to establish loopback connection" -- that is a
# separate problem with a separate fix, and it is not the JDK. See `android/README.md`, section
# "Unable to establish loopback connection -- it is not the JDK".
